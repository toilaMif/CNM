services:
  backend:
    build: .
    container_name: WEB_CNM

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    restart: always

    volumes:
      - .:/app
      - /app/node_modules

    networks:
      - app_network

  db:
    image: mysql:8.0
    container_name: agro_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: agro_db

    ports:
      - "3307:3306"

    volumes:
      - db_data:/var/lib/mysql
      - ./agro_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    command: --default-authentication-plugin=mysql_native_password

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: agro_phpmyadmin

    restart: always

    ports:
      - "8081:80"

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: example

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
